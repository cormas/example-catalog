name: Check

# Blocks a pull request whose lines are not valid: a models.txt that is not
# sorted or lists a version twice, a version without a valid cormas.json and
# screenshot.png, a branch in a released line, or a released line that would
# lose or change a version it already offers.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - name: Test the catalog script
        run: python -m unittest discover tools
      - name: Check every line and the versions it lists
        run: python tools/catalog.py check
