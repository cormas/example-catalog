name: Check

# Blocks a pull request whose models.txt is not sorted or unique, or lists a
# repository without a valid cormas.json and screenshot.png.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - name: Test the catalog script
        run: python -m unittest discover tools
      - name: Check models.txt and the repositories it lists
        run: python tools/catalog.py check
