name: Notify

# A reusable workflow that official model repositories call, with
# model-repository/notify-catalog.yml, when their cormas.json or screenshot.png
# changes. It asks this repository to regenerate the catalog at once instead of
# the next night. It runs only on the caller's default branch, and does
# nothing when the caller has no CORMAS_CATALOG_TOKEN secret.

on:
  workflow_call:
    secrets:
      CORMAS_CATALOG_TOKEN:
        required: false

jobs:
  notify:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.CORMAS_CATALOG_TOKEN }}
    steps:
      - name: Ask the catalog to regenerate
        if: env.TOKEN != ''
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cormas/example-catalog/dispatches \
            -d '{"event_type": "model-changed"}'
