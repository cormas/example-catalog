name: Notify the Cormas catalog

# Copy this file to .github/workflows/ in an official model repository. When
# cormas.json or screenshot.png changes on a branch, the catalog of example
# models is regenerated at once instead of the next night. The work is
# done by the reusable workflow .github/workflows/notify.yml of
# cormas/example-catalog.

on:
  push:
    paths:
      - cormas.json
      - screenshot.png

jobs:
  notify:
    uses: cormas/example-catalog/.github/workflows/notify.yml@main
    secrets: inherit
